<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Descargador</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #181818;
            color: white;

            display: flex;
            justify-content: center;

            min-height: 100vh;
            padding: 80px 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #242424;

            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .field {
            margin-bottom: 20px;
        }

        .field p {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 12px;

            background: #181818;
            color: white;

            border: 1px solid #444;
            border-radius: 6px;

            resize: vertical;

            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea:focus {
            outline: none;
            border-color: #777;
        }

        input[type="file"] {
            width: 100%;
        }

        .separator {
            text-align: center;
            color: #aaa;
            margin: 20px 0;
        }

        label {
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .help {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }

        .progress-container {
            display: none;

            margin-top: 30px;
            padding-top: 22px;

            border-top: 1px solid #444;
        }

        .progress-text {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .progress-bar-background {
            width: 100%;
            height: 18px;

            background: #181818;

            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background: #e7e7e7;

            transition: width 0.25s ease;
        }

        .percentage {
            text-align: center;
            margin-top: 8px;

            font-size: 13px;
            color: #bbb;
        }

        .success {
            color: #7ee787;
        }

        .error {
            color: #ff7b72;
        }
    </style>
</head>


<body>

<div class="container">

    <h1>Descargador</h1>

    <form id="download-form">

        <div class="field">
            <p>Pega uno o varios enlaces:</p>

            <textarea
                name="urls"
                rows="5"
                placeholder="https://www.youtube.com/watch?v=...
https://youtu.be/..."
            ></textarea>

            <div class="help">
                Puedes ingresar varios enlaces, uno por línea.
            </div>
        </div>


        <div class="separator">
            — o —
        </div>


        <div class="field">
            <p>Sube un archivo con enlaces:</p>

            <input
                type="file"
                name="file"
                accept=".txt,.docx,.xlsx"
            >

            <div class="help">
                Formatos compatibles: TXT, Word y Excel.
            </div>
        </div>


        <div class="field">
            <p>¿Qué deseas descargar?</p>

            <label>
                <input
                    type="radio"
                    name="format"
                    value="video"
                    checked
                >
                Video MP4
            </label>

            <br><br>

            <label>
                <input
                    type="radio"
                    name="format"
                    value="audio"
                >
                Audio MP3
            </label>
        </div>


        <button
            id="download-button"
            type="submit"
        >
            Descargar
        </button>

    </form>


    <div
        id="progress-container"
        class="progress-container"
    >
        <div
            id="progress-text"
            class="progress-text"
        >
            Preparando descarga...
        </div>

        <div class="progress-bar-background">
            <div
                id="progress-bar"
                class="progress-bar"
            ></div>
        </div>

        <div
            id="percentage"
            class="percentage"
        >
            0%
        </div>
    </div>

</div>


<!--
    ESTE BLOQUE <script> ES JAVASCRIPT.

    No necesitas crear un archivo .js aparte.
    El JavaScript puede vivir dentro de index.html,
    como lo hacemos aquí.
-->
<script>
    const form = document.getElementById("download-form");
    const button = document.getElementById("download-button");
    const progressContainer = document.getElementById("progress-container");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const percentage = document.getElementById("percentage");

    let pollingTimer = null;


    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (pollingTimer) {
            clearTimeout(pollingTimer);
            pollingTimer = null;
        }

        button.disabled = true;

        progressContainer.style.display = "block";

        progressBar.style.width = "0%";
        progressBar.style.background = "#e7e7e7";

        percentage.textContent = "0%";

        progressText.className = "progress-text";
        progressText.textContent = "Preparando descarga...";

        const formData = new FormData(form);

        try {
            const response = await fetch("/start", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "No se pudo iniciar la descarga."
                );
            }

            checkProgress(data.job_id);

        } catch (error) {
            showError(error.message);
        }
    });


    async function checkProgress(jobId) {
        try {
            const response = await fetch(`/progress/${jobId}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "No se pudo consultar el progreso."
                );
            }

            if (data.status === "error") {
                showError(data.message);
                return;
            }

            const progress = Math.max(
                0,
                Math.min(100, Math.round(data.progress || 0))
            );

            progressBar.style.width = progress + "%";
            percentage.textContent = progress + "%";
            progressText.textContent = data.message;

            if (data.status === "finished") {
                progressBar.style.width = "100%";
                progressBar.style.background = "#7ee787";

                percentage.textContent = "100%";

                progressText.className = "progress-text success";
                progressText.textContent =
                    data.message + " Iniciando descarga...";

                button.disabled = false;

                /*
                    Esto llama a /file/<job_id>.
                    Flask responde con Content-Disposition: attachment,
                    por eso Chrome lo muestra como una descarga normal.
                */
                window.location.href = `/file/${jobId}`;

                return;
            }

            pollingTimer = setTimeout(
                () => checkProgress(jobId),
                500
            );

        } catch (error) {
            showError(error.message);
        }
    }


    function showError(message) {
        if (pollingTimer) {
            clearTimeout(pollingTimer);
            pollingTimer = null;
        }

        progressBar.style.width = "100%";
        progressBar.style.background = "#ff7b72";

        percentage.textContent = "Error";

        progressText.className = "progress-text error";
        progressText.textContent = message;

        button.disabled = false;
    }
</script>

</body>
</html>
